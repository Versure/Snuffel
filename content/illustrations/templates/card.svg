<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <!--
    Template: a card with a hard shadow (a black copy 6 to the right and 6 down, drawn first).
    Change the fill of the card to another palette colour; keep labels short (24 characters).
  -->
  <rect x="26" y="26" width="348" height="148" rx="12" fill="#141414"/>
  <rect x="20" y="20" width="348" height="148" rx="12" fill="#ffd83d" stroke="#141414" stroke-width="3"/>
  <g font-family="Atkinson Hyperlegible, Verdana, sans-serif" fill="#141414">
    <text x="44" y="68" font-size="24" font-weight="700">Titel</text>
    <text x="44" y="108" font-size="18" font-weight="400">Een kort label</text>
  </g>
</svg>
