<div
  class="track"
  role="progressbar"
  aria-valuemin="0"
  [attr.aria-valuemax]="safeMax()"
  [attr.aria-valuenow]="safeValue()"
  [attr.aria-valuetext]="label()"
  [attr.aria-label]="name()"
>
  <div class="fill" [style.width.%]="percent()"></div>
</div>
<p class="label" aria-hidden="true">{{ label() }}</p>
