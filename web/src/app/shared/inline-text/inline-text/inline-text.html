<ng-container *ngTemplateOutlet="list; context: { $implicit: tokens() }" />

<ng-template #list let-tokens>
  @for (token of tokens; track $index) {
    @switch (token.type) {
      @case ('strong') {
        <strong
          ><ng-container *ngTemplateOutlet="list; context: { $implicit: token.children }"
        /></strong>
      }
      @case ('em') {
        <em><ng-container *ngTemplateOutlet="list; context: { $implicit: token.children }" /></em>
      }
      @case ('link') {
        <snf-external-link [url]="token.url" [label]="token.text" />
      }
      @case ('term') {
        @if (terms()) {
          <snf-glossary-term [term]="token.term" [text]="token.text" />
        } @else {
          <ng-container>{{ token.text }}</ng-container>
        }
      }
      @default {
        <ng-container>{{ token.text }}</ng-container>
      }
    }
  }
</ng-template>
