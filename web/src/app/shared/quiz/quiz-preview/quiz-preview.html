@if (step().intro; as intro) {
  <p class="intro"><snf-inline-text [text]="intro" /></p>
}
<snf-ted-says class="note" mood="thinking" size="small">
  Deze quiz kun je binnenkort echt maken.
</snf-ted-says>
<ol class="questions">
  @for (question of step().questions; track question.id) {
    <li class="question">
      <p class="prompt"><snf-inline-text [text]="question.prompt" /></p>
      <ul class="options">
        @for (option of question.options; track option.id; let index = $index) {
          <li class="option">
            <span class="letter"
              >{{ letter(index) }}<span class="snf-visually-hidden">. </span></span
            >
            <span class="option-text"><snf-inline-text [text]="option.text" /></span>
          </li>
        }
      </ul>
    </li>
  }
</ol>
