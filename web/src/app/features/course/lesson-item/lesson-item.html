<span class="number" aria-hidden="true">{{ number() }}</span>
<span class="snf-visually-hidden">{{ text.lessonNumber(number()) }}</span>
<div class="body">
  @if (planned()) {
    <span class="title">{{ title() }}</span>
  } @else {
    <a class="title" [routerLink]="link()">{{ title() }}</a>
  }
  <div class="meta">
    @if (lesson().estimatedMinutes; as minutes) {
      <span class="minutes">{{ text.minutes(minutes) }}</span>
    }
    @if (status(); as status) {
      <snf-lesson-status
        [status]="status"
        [done]="progress()?.done ?? 0"
        [total]="progress()?.total ?? 0"
      />
    }
  </div>
</div>
